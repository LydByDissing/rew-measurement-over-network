# Docker Compose for REW Audio Receiver with CamillaDSP
# Works on both x86_64 (testing) and ARM (Pi deployment)

services:
  rew-audio-receiver:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm/v6
    image: rew-audio-receiver:latest
    container_name: rew-audio-receiver
    hostname: ${PI_HOSTNAME:-rew-pi}
    
    # Port mapping for audio receiver services
    ports:
      - "1234:1234"     # CamillaDSP API
      - "8000:8000/udp" # Default audio bridge port
      - "5004:5004/udp" # RTP input port
    
    # Restart policy
    restart: unless-stopped
    
    # Volume mounts for audio and logging
    volumes:
      # Audio system access (ALSA + PulseAudio)
      - /dev/snd:/dev/snd:rw
      - /run/user/1000/pulse:/run/user/1000/pulse:ro
      - /var/lib/alsa:/var/lib/alsa:ro
      - /usr/share/alsa:/usr/share/alsa:ro
      # PulseAudio cookie for authentication
      - ${HOME}/.config/pulse/cookie:/home/rew/.config/pulse/cookie:ro
      # Shared memory for better audio performance
      - /dev/shm:/dev/shm
      
      # Logs persistence  
      - ./logs:/app/logs
      
      # Audio output for debugging
      - ./audio-output:/tmp/audio
      
      # Optional: Configuration overrides (only mount if ./config directory exists)
      # - ./config:/app/config:ro
    
    # Environment variables
    environment:
      - PI_HOSTNAME=${PI_HOSTNAME:-rew-pi}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - AUDIO_DEVICE=${AUDIO_DEVICE:-hw:0,0}
    
    # User matching PipeWire user
    user: "1000:1000"

    # Audio group access
    group_add:
      - audio
    
    # Resource limits (adjust for Pi model)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M
    #       cpus: '1'
    #     reservations:
    #       memory: 64M
    #       cpus: '1'
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

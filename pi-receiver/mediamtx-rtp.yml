# MediaMTX Configuration for REW Audio Receiver with RTP Input
# Optimized for RTP → CamillaDSP → Merus amplifier workflow

logLevel: info

# API for remote control
api: true
apiAddress: 0.0.0.0:9997

# RTSP server
rtspAddress: 0.0.0.0:8554

# RTP server for receiving streams
rtpAddress: 0.0.0.0:8000

# WebRTC configuration
webrtcAddress: 0.0.0.0:8889

# Paths configuration
paths:
  # Default path for all streams
  all:
    source: publisher
    
  # Specific path for REW audio input
  rew_audio:
    # Accept RTP input on port 5004
    source: rtp://0.0.0.0:5004
    
    # Output received RTP audio to ALSA loopback for CamillaDSP processing
    # MediaMTX will output audio to hw:Loopback,0,0 (playback side)
    # CamillaDSP will capture from hw:Loopback,1,0 (capture side)
    runOnReady: ffmpeg -re -f rtp -i rtp://0.0.0.0:5004 -f alsa -acodec pcm_s16le -ac 2 -ar 48000 hw:Loopback,0,0
    runOnReadyRestart: yes
    
    # Optional: Record streams for debugging
    # record: true
    # recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S.mp4

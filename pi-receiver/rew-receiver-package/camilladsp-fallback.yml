# CamillaDSP Minimal Configuration - bypasses ALSA enumeration issues
devices:
  samplerate: 48000
  chunksize: 2048
  enable_rate_adjust: false
  silence_threshold: -60
  silence_timeout: 3.0

  capture:
    type: Alsa
    channels: 2
    device: "hw:1,1"
    format: S16LE

  playback:
    type: Alsa
    channels: 2
    device: "hw:0,0"
    format: S32LE
    avoid_blocking_read: true

# Simple passthrough mixer
mixers:
  main:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0.0
      - dest: 1
        sources:
          - channel: 1
            gain: 0.0

pipeline:
  - type: Mixer
    name: main
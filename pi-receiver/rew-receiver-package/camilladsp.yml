# CamillaDSP Configuration for MediaMTX → ALSA Loopback → Merus Amplifier
# Template file - audio device is configurable via AUDIO_DEVICE environment variable
devices:
  samplerate: 48000
  chunksize: 2048
  enable_rate_adjust: false
  silence_threshold: -60
  silence_timeout: 3.0

  capture:
    type: Alsa
    channels: 2
    device: "plughw:CARD=Loopback,DEV=1"  # Capture from MediaMTX via ALSA loopback with plug layer
    format: S16LE

  playback:
    type: Alsa
    channels: 2
    device: "hw:CARD=sndrpimerusamp"  # Output to Merus amplifier (hw:CARD=sndrpimerusamp)
    format: S32LE

# Simple passthrough mixer
mixers:
  main:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0.0
      - dest: 1
        sources:
          - channel: 1
            gain: 0.0

pipeline:
  - type: Mixer
    name: main

# CamillaDSP Minimal Configuration - avoids ALSA enumeration issues
devices:
  samplerate: 48000
  chunksize: 4096
  enable_rate_adjust: false
  enable_resampling: false
  resampler_type: BalancedAsync
  capture_samplerate: 48000
  silence_threshold: -60
  silence_timeout: 3.0
  target_level: 12000
  adjust_period: 10
  avoid_clipping: true

  capture:
    type: Stdin
    channels: 2
    format: S16LE

  playback:
    type: Stdout
    channels: 2
    format: S16LE

# No processing - just pass through
mixers:
  main:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0.0
      - dest: 1
        sources:
          - channel: 1
            gain: 0.0

pipeline:
  - type: Mixer
    name: main